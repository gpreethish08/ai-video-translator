version: '3.8'

services:
  ai-video-translator:
    build: .
    container_name: ai_video_translator
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/outputs:/app/backend/outputs
      - ./database:/app/database
    environment:
      - PYTHONUNBUFFERED=1
      - MAX_VIDEO_DURATION_MINUTES=40
